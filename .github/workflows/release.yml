name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_VERSION: 1.2.0

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          $installed = dotnet tool list --global | Select-String -Pattern '^vpk\s'
          if ($installed) {
            dotnet tool update --global vpk --version $env:VPK_VERSION --allow-downgrade
          } else {
            dotnet tool install --global vpk --version $env:VPK_VERSION
          }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          vpk -H

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and package version
        id: release-version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -ne 'tag') {
            throw 'Release workflow must run from a vX.Y.Z Git tag.'
          }

          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $tag. Expected vX.Y.Z."
          }

          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = $tag.Substring(1)
          if ($packageVersion -ne $tagVersion) {
            throw "Git tag version $tagVersion does not match package.json version $packageVersion"
          }

          "RELEASE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Typecheck application
        run: pnpm typecheck

      - name: Test Windows application
        run: pnpm test

      - name: Build Windows application
        run: pnpm package:win

      - name: Download previous Velopack release
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/velopack | Out-Null
          vpk download github `
            --outputDir dist/velopack `
            --repoUrl "https://github.com/baozha2023/JobTrail" `
            --token $env:GITHUB_TOKEN

      - name: Pack Velopack release
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'dist/velopack'
          Get-ChildItem -Path $releaseDir -Filter '*.msi' -File -ErrorAction SilentlyContinue | Remove-Item -Force

          vpk pack `
            --outputDir $releaseDir `
            --packId zhiji `
            --packVersion $env:RELEASE_VERSION `
            --packDir (Join-Path $env:GITHUB_WORKSPACE 'dist/win-unpacked') `
            --packTitle '职迹' `
            --mainExe zhiji.exe `
            --icon (Join-Path $env:GITHUB_WORKSPACE 'resource/icon.ico')

      - name: Verify Velopack assets
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'dist/velopack'
          $requiredFiles = @(
            'RELEASES',
            'releases.win.json',
            'assets.win.json',
            'zhiji-win-Setup.exe',
            'zhiji-win-Portable.zip'
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $releaseDir $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Velopack asset: $file"
            }
          }

          if (-not (Get-ChildItem -Path $releaseDir -Filter '*.nupkg' -File -ErrorAction SilentlyContinue)) {
            throw 'No Velopack package was generated.'
          }

          if (Get-ChildItem -Path $releaseDir -Filter '*.msi' -File -ErrorAction SilentlyContinue) {
            throw 'MSI artifacts are not part of the current distribution.'
          }

          Get-ChildItem -Path $releaseDir -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Preserve release assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhiji-${{ steps.release-version.outputs.version }}-velopack-assets
          path: dist/velopack/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          vpk upload github `
            --outputDir (Join-Path $env:GITHUB_WORKSPACE 'dist/velopack') `
            --repoUrl "https://github.com/baozha2023/JobTrail" `
            --token $env:GITHUB_TOKEN `
            --publish `
            --releaseName "职迹 $env:RELEASE_VERSION" `
            --tag "v$env:RELEASE_VERSION"
