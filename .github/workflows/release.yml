name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_VERSION: 1.2.0

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          $installed = dotnet tool list --global | Select-String -Pattern '^vpk\s'
          if ($installed) {
            dotnet tool update --global vpk --version $env:VPK_VERSION --allow-downgrade
          } else {
            dotnet tool install --global vpk --version $env:VPK_VERSION
          }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          vpk -H

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and package version
        id: release-version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw 'Release workflow must run from a vX.Y.Z Git tag.'
          }

          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $tag. Expected vX.Y.Z."
          }

          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = $tag.Substring(1)
          if ($packageVersion -ne $tagVersion) {
            throw "Git tag version $tagVersion does not match package.json version $packageVersion"
          }

          "RELEASE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Test Windows application
        run: pnpm test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust
        run: |
          cargo test --manifest-path native/bootstrap/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path native/bootstrap/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build offline installer and update packages
        run: pnpm release:win

      - name: Preserve release assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhiji-${{ steps.release-version.outputs.version }}-velopack-assets
          path: dist/velopack/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          gh release create "v$env:RELEASE_VERSION" --verify-tag --title "职迹 $env:RELEASE_VERSION" --generate-notes dist/velopack/*
